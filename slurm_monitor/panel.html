<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slurm jobs</title>
<style>
:root {color-scheme:light dark;font:14px/1.5 Inter,system-ui,sans-serif}
body {margin:16px} header,nav {display:flex;align-items:center;gap:8px}
h1 {font-size:18px;margin:0 auto 0 0} button {font:inherit;cursor:pointer}
table {width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th {text-align:left;padding:6px 8px;border-bottom:1px solid #8886}
section {margin:16px 0;overflow:auto} h2 {font-size:14px} #status {overflow-wrap:anywhere}
</style>
<header><h1>Slurm jobs</h1><button id="refresh">Refresh</button></header>
<p id="status" role="status"></p><main></main>
<nav><button id="previous" hidden>Previous</button><button id="next" hidden>Next</button></nav>
<script>
const pending = new Map();
let sequence = 0, revision = 0, offset = 0, nextOffset = null, thread = null;
const select = selector => document.querySelector(selector);
function request(method, params) {
  const id = ++sequence;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(id); reject(Error("Host timed out")); }, 15000);
    pending.set(id, {resolve, reject, timer});
    parent.postMessage({jsonrpc:"2.0", id, method, params}, "*");
  });
}
function element(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function render(result) {
  select("main").replaceChildren();
  select("#status").textContent = result.waits.length ? "" : "No watched jobs.";
  for (const wait of result.waits) {
    const group = element("section", "");
    group.append(element("h2", [wait.host, wait.mode, wait.status, wait.delivery_status].filter(Boolean).join(" · ")));
    const table = element("table", "");
    const header = table.createTHead().insertRow();
    for (const label of ["Job", "State", "Exit code"]) header.append(element("th", label));
    const body = table.createTBody();
    for (const job of wait.jobs) {
      const row = body.insertRow();
      for (const value of [job.scheduler_id, job.state, job.exit_code ?? "—"]) row.insertCell().textContent = value;
      if (job.error) group.append(element("p", job.scheduler_id + " · " + job.error));
    }
    group.append(table);
    if (wait.delivery_error) group.append(element("p", wait.delivery_error));
    select("main").append(group);
  }
  nextOffset = result.next_offset;
  select("#previous").hidden = offset === 0;
  select("#next").hidden = nextOffset === null;
}
async function refresh() {
  const current = ++revision;
  try {
    const args = thread ? {thread_id:thread, offset} : {offset};
    const result = await request("tools/call", {name:"monitor_list", arguments:args});
    if (current !== revision) return;
    if (result.isError) throw Error(result.content[0].text);
    render(result.structuredContent);
  } catch (error) { if (current === revision) select("#status").textContent = error.message; }
}
window.addEventListener("message", event => {
  if (event.source !== parent || event.data?.jsonrpc !== "2.0") return;
  const message = event.data, reply = pending.get(message.id);
  if (reply) {
    clearTimeout(reply.timer); pending.delete(message.id);
    if (message.error) reply.reject(Error(message.error.message));
    else reply.resolve(message.result);
  }
  const data = message.params?.structuredContent;
  if (message.method === "ui/notifications/tool-result" && data?.waits) {
    revision++; thread = data.thread_id; offset = 0; render(data);
  }
});
select("#refresh").onclick = refresh;
select("#previous").onclick = () => {offset = Math.max(0, offset-50); refresh();};
select("#next").onclick = () => {offset = nextOffset; refresh();};
request("ui/initialize", {protocolVersion:"2026-01-26",appInfo:{name:"Slurm Monitor",version:"1.0.0"},appCapabilities:{}})
  .then(() => {
    parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}}, "*");
    refresh();
  }).catch(error => {select("#status").textContent = error.message;});
</script></html>
